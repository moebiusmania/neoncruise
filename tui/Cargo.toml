[package]
name = "neoncruise-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Neon Cruise in the terminal: a retro outrun cassette player for Nightride FM"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29"
dirs = "7.0.0"
ratatui = "0.30"
rodio = { version = "0.23.0", default-features = false, features = ["playback"] }
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
symphonia = { version = "0.5", default-features = false, features = ["mp3"] }
unicode-width = "0.2.3"
ureq = { version = "3", features = ["json"] }

# Smaller, faster release binaries (the per-frame canvas, FFT and post-processing are hot loops).
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
